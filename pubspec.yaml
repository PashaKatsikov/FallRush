name: fallrush
description: "Fall Rush - neon ball tube runner"
publish_to: 'none'
version: 1.0.1+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Persistence
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Networking + device
  http: ^1.4.0
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2

  # Attribution + Firebase
  appsflyer_sdk: ^6.16.0
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1

  # WebView + media
  webview_flutter: ^4.13.2
  webview_flutter_android: ^4.11.1
  video_player: ^2.9.4
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/assets_png/icon.png"
  min_sdk_android: 30
  remove_alpha_ios: true
  background_color_ios: "#05060F"
  adaptive_icon_background: "#05060F"
  adaptive_icon_foreground: "assets/assets_png/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/assets_webp/
