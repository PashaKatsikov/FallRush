name: fallrush
description: "Fall Rush — neon ball tube runner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/assets_png/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#05060F"
  adaptive_icon_background: "#05060F"
  adaptive_icon_foreground: "assets/assets_png/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    # Only webp assets are bundled. PNGs in assets_png/ (icon, source loading
    # screens) are used at build time by flutter_launcher_icons / tools only.
    - assets/assets_webp/
